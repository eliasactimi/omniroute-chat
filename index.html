<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniRoute Chat</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e4e2dc;--accent:#2f6f5e;--accent-ink:#fff;--user:#e8f0ed;--warn-bg:#fff4e0;--warn-line:#e7b45a;--claude:#c96442}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--panel:#1f1f1d;--ink:#ecebe6;--muted:#a3a29b;--line:#34332f;--accent:#5fb39b;--accent-ink:#0d1f1a;--user:#24302c;--warn-bg:#33291a;--warn-line:#a07a35;--claude:#e08a6a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0;font-weight:650}
header select,header button,header input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{cursor:pointer}
#status{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:var(--user);align-self:flex-end;max-width:85%}
.msg .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.msg pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
.msg code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.banner{border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:12px;padding:12px 14px}
.banner b{display:block;margin-bottom:6px}
.banner .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.claude{background:var(--claude);color:#fff;border-color:var(--claude)}
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
footer .wrap{flex-direction:row;gap:8px;align-items:flex-end}
textarea{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:none;min-height:46px;max-height:220px}
.empty{color:var(--muted);text-align:center;margin-top:12vh}
.empty p{max-width:520px;margin:8px auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:460px;width:calc(100% - 32px)}
dialog input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:6px 0 12px}
dialog label{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>OmniRoute Chat <span style="font-weight:400;color:var(--muted)">· gratis</span></h1>
  <span id="status">bereit</span>
  <select id="model" title="Kombination">
    <option value="free">free – Chat &amp; Texte</option>
    <option value="free-code">free-code – Coding</option>
  </select>
  <button id="toClaude" class="btn claude" title="Gesamte Unterhaltung an Claude übergeben">An Claude übergeben</button>
  <button id="clear" class="btn">Neu</button>
  <button id="settingsBtn" class="btn" title="Einstellungen">⚙</button>
</header>

<main><div class="wrap" id="log"></div></main>

<footer><div class="wrap">
  <textarea id="input" placeholder="Nachricht … (Enter senden, Umschalt+Enter neue Zeile)"></textarea>
  <button id="send" class="btn primary">Senden</button>
</div></footer>

<dialog id="settings">
  <h3 style="margin-top:0">Einstellungen</h3>
  <label>Gemini-API-Key (Google AI Studio)</label>
  <input id="geminiKey" type="password" placeholder="AIza… oder AQ.…" autocomplete="off">
  <label>Groq-API-Key</label>
  <input id="groqKey" type="password" placeholder="gsk_…" autocomplete="off">
  <details style="margin-bottom:12px">
    <summary style="font-size:13px;color:var(--muted);cursor:pointer">OmniRoute (optional, wenn dein PC läuft)</summary>
    <label>OmniRoute-Adresse</label>
    <input id="baseUrl" placeholder="https://desktop-sb3bjc1.tailf0b48a.ts.net/v1">
    <label>OmniRoute-Schlüssel</label>
    <input id="apiKey" type="password" placeholder="sk-…" autocomplete="off">
  </details>
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Keys bleiben nur in diesem Browser gespeichert. Mindestens Gemini oder Groq eintragen, dann läuft der Chat ohne PC.</div>
  <div id="settingsErr" style="font-size:13px;color:var(--claude);margin-bottom:12px"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="cancelSettings">Abbrechen</button>
    <button class="btn primary" id="saveSettings">Speichern</button>
  </div>
</dialog>

<script>
const SYSTEM = `Du bist ein Alltags-Assistent. Antworte auf Deutsch, klar und knapp.

Prüfe vor jeder Antwort, ob die Aufgabe Claude braucht. Das ist der Fall, wenn mindestens eins zutrifft:
1. Es geht um Patienten-, Gesundheits-, Kunden- oder vertrauliche Firmendaten.
2. Umfangreiche Programmierarbeit über mehrere Dateien, Architektur- oder Sicherheitsentscheidungen.
3. Sehr lange Dokumente oder tiefgehende, mehrstufige Analysen.
4. Hohe Tragweite: Recht, Verträge, Finanzen, Medizin, Compliance.
5. Du bist unsicher, ob deine Antwort zuverlässig ist.

Trifft etwas zu, beginne deine Antwort exakt mit einer Zeile im Format
[[CLAUDE]] <kurzer Grund in einem Satz>
und gib danach höchstens zwei Sätze Hinweis, aber keine vollständige Lösung.
Trifft nichts zu, löse die Aufgabe direkt und ohne diese Markierung.`;
const SYSTEM_FORCE = 'Du bist ein Alltags-Assistent. Antworte auf Deutsch, klar und knapp. Löse die Aufgabe direkt, so gut du kannst.';

const SENSITIVE = /\b(patient|patientin|diagnose|befund|krankheit|medikament|versichertennummer|krankenkasse|iban|bic|passwort|kennwort|geburtsdatum|sozialversicherung|gehalt|personalakte|vertraulich)\b/i;

const PROVIDERS = {
  omni:   { name:'OmniRoute', base: () => store.get('baseUrl',''), key: () => store.get('apiKey',''), headerTimeout: 5000 },
  gemini: { name:'Gemini', base: () => 'https://generativelanguage.googleapis.com/v1beta/openai', key: () => store.get('geminiKey',''), headerTimeout: 30000 },
  groq:   { name:'Groq', base: () => 'https://api.groq.com/openai/v1', key: () => store.get('groqKey',''), headerTimeout: 30000 }
};
const GEMINI = ['gemini-4-argon','gemini-3.1-pro-preview','gemini-3.8-flash','gemini-3-flash-preview','gemini-3.1-flash-lite'];
const CHAINS = {
  'free': [['omni','free'], ...GEMINI.map(m=>['gemini',m]), ['groq','openai/gpt-oss-120b'], ['groq','openai/gpt-oss-20b'], ['groq','qwen/qwen3.8-27b']],
  'free-code': [['omni','free-code'], ...GEMINI.map(m=>['gemini',m]), ['groq','openai/gpt-oss-120b'], ['groq','openai/gpt-oss-20b']]
};

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('omc_'+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
  set(k, v){ try{ localStorage.setItem('omc_'+k, JSON.stringify(v)); }catch(e){} }
};

const BAD_CHARS = [0x200B,0x200C,0x200D,0x2060,0xFEFF,0xA0,0x22,0x27,0x201C,0x201D,0x201E,0x2018,0x2019,0x201A,0xAB,0xBB].map(c => String.fromCharCode(c));
function cleanKey(k){ return [...(k||'')].filter(c => !BAD_CHARS.includes(c) && !/\s/.test(c)).join(''); }
const validKey = k => /^[\x21-\x7E]+$/.test(k) && !k.includes('*');

let history = store.get('history', []);
let busy = false;
$('model').value = store.get('model', 'free');
for(const f of ['geminiKey','groqKey','apiKey','baseUrl']) $(f).value = store.get(f, '');
if(!store.get('baseUrl','') && (location.protocol==='file:'||location.hostname==='localhost')) $('baseUrl').value = 'http://localhost:20128/v1';

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(s){
  const parts = s.split(/```/);
  return parts.map((p,i)=>{
    if(i%2){ const nl = p.indexOf('\n'); const code = nl>-1 ? p.slice(nl+1) : p; return '<pre><code>'+esc(code)+'</code></pre>'; }
    return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  }).join('');
}

function configured(){ return !!(store.get('geminiKey','') || store.get('groqKey','') || (store.get('baseUrl','') && store.get('apiKey',''))); }

function render(){
  const log = $('log'); log.innerHTML = '';
  if(!history.length){
    log.innerHTML = `<div class="empty"><h2 style="margin:0">Was steht an?</h2>
      <p>Läuft gratis über Gemini und Groq, wenn dein PC an ist zuerst über OmniRoute. Euer Claude-Kontingent wird hier nicht verbraucht.</p>
      <p>Braucht eine Aufgabe Claude, erscheint ein Hinweis mit Übergabe-Button.</p>
      <p style="font-size:13px">Keine Patienten-, Kunden- oder internen Firmendaten eingeben – die gehören direkt zu Claude.</p></div>`;
    return;
  }
  for(const m of history){
    if(m.role === 'user'){
      const d = document.createElement('div'); d.className = 'msg user'; d.innerHTML = fmt(m.content); log.appendChild(d);
    } else if(m.role === 'assistant'){
      const text = m.content || '';
      const match = text.match(/^\s*\[\[CLAUDE\]\]\s*(.*)/);
      if(match){
        const reason = match[1].split('\n')[0];
        const rest = text.replace(/^\s*\[\[CLAUDE\]\][^\n]*\n?/, '').trim();
        const b = document.createElement('div'); b.className = 'banner';
        b.innerHTML = `<b>Dafür ist Claude besser geeignet</b>${esc(reason)}${rest?'<div style="margin-top:6px">'+fmt(rest)+'</div>':''}
          <div class="row"><button class="btn claude" data-act="claude">An Claude übergeben</button>
          <button class="btn" data-act="force">Trotzdem gratis beantworten</button></div>`;
        b.querySelector('[data-act=claude]').onclick = handToClaude;
        b.querySelector('[data-act=force]').onclick = () => forceFree(m);
        log.appendChild(b);
      } else {
        const d = document.createElement('div'); d.className = 'msg';
        d.innerHTML = (m.model ? `<div class="meta">${esc(m.model)}</div>` : '') + fmt(text || '…');
        log.appendChild(d);
      }
    } else if(m.role === 'error'){
      const d = document.createElement('div'); d.className = 'banner'; d.innerHTML = '<b>Fehler</b>'+esc(m.content); log.appendChild(d);
    }
  }
  $('log').parentElement.scrollTop = 1e9;
}

function save(){ store.set('history', history.filter(m => m.role !== 'error')); }

function sensitiveWarning(text, onContinue){
  const b = document.createElement('div'); b.className = 'banner';
  b.innerHTML = `<b>Sieht nach sensiblen Daten aus</b>Gratis-Anbieter dürfen Eingaben teilweise weiterverwenden. Solche Daten besser direkt in Claude bearbeiten.
    <div class="row"><button class="btn claude" data-a="c">In Claude öffnen</button><button class="btn" data-a="s">Trotzdem hier senden</button></div>`;
  b.querySelector('[data-a=c]').onclick = () => { openClaude(text); b.remove(); };
  b.querySelector('[data-a=s]').onclick = () => { b.remove(); onContinue(); };
  $('log').appendChild(b); $('log').parentElement.scrollTop = 1e9;
}

// Abkühlzeiten: ausgelastete oder kaputte Modelle werden eine Weile übersprungen
function coolKey(p, m){ return p + '|' + m; }
function isCooling(p, m){ const c = store.get('cool', {}); return (c[coolKey(p,m)]||0) > Date.now() || (c[coolKey(p,'*')]||0) > Date.now(); }
function cool(p, m, ms){ const c = store.get('cool', {}); c[coolKey(p,m)] = Date.now() + ms; store.set('cool', c); }

async function tryTarget(prov, model, messages, msg){
  const P = PROVIDERS[prov]; const base = (P.base()||'').replace(/\/$/,''); const key = P.key();
  if(!base || !key) return {skip:true};
  if(isCooling(prov, model)) return {skip:true};
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), P.headerTimeout);
  let r;
  try{
    r = await fetch(base + '/chat/completions', {
      method:'POST', signal: ctrl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({model, messages, stream:true})
    });
  }catch(e){
    clearTimeout(timer);
    cool(prov, prov==='omni' ? '*' : model, prov==='omni' ? 120000 : 60000);
    return {error: P.name + ' nicht erreichbar'};
  }
  clearTimeout(timer);
  if(!r.ok){
    const t = (await r.text().catch(()=>'')).slice(0,200);
    if(r.status === 429) cool(prov, model, 10*60000);
    else if(r.status === 404) cool(prov, model, 24*3600000);
    else if(r.status === 401 || r.status === 403) cool(prov, '*', 5*60000);
    else cool(prov, model, 120000);
    return {error: P.name + ' ' + model + ': ' + r.status + (t ? ' ' + t : '')};
  }
  msg.model = P.name + ' · ' + model;
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while(true){
    const {done, value} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split('\n'); buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      const data = line.slice(5).trim(); if(!data || data === '[DONE]') continue;
      try{
        const j = JSON.parse(data);
        if(prov === 'omni' && j.model) msg.model = 'OmniRoute · ' + j.model;
        const delta = j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content ?? '';
        if(delta){ msg.content += delta; render(); }
      }catch(e){}
    }
  }
  if(!msg.content){ cool(prov, model, 120000); return {error: P.name + ' ' + model + ': leere Antwort'}; }
  return {ok:true};
}

async function send(text, opts = {}){
  if(busy) return;
  if(!configured()){ $('settings').showModal(); return; }
  if(!opts.retry) history.push({role:'user', content:text});
  const msg = {role:'assistant', content:'', model:''}; history.push(msg);
  render(); busy = true; $('send').disabled = true;
  const messages = [{role:'system', content: opts.force ? SYSTEM_FORCE : SYSTEM}, ...history.filter(m => (m.role==='user'||m.role==='assistant') && m !== msg && !(m.content||'').startsWith('[[CLAUDE]]')).map(m => ({role:m.role, content:m.content}))];
  const errors = []; let done = false;
  for(const [prov, model] of CHAINS[$('model').value]){
    $('status').textContent = PROVIDERS[prov].name + ' …';
    msg.content = ''; msg.model = '';
    const res = await tryTarget(prov, model, messages, msg);
    if(res.ok){ done = true; break; }
    if(res.error) errors.push(res.error);
  }
  if(!done){
    history.pop();
    history.push({role:'error', content: 'Kein Anbieter hat geantwortet. ' + (errors.length ? errors.slice(-3).join(' · ') : 'Bitte Keys unter ⚙ prüfen.')});
  }
  busy = false; $('status').textContent = 'bereit'; $('send').disabled = false;
  save(); render();
}

function forceFree(m){
  const i = history.indexOf(m); if(i>-1) history.splice(i,1);
  send(null, {retry:true, force:true});
}

function transcript(){
  return history.filter(m => m.role==='user'||m.role==='assistant')
    .map(m => (m.role==='user' ? 'Ich: ' : 'Assistent: ') + (m.content||'').replace(/^\s*\[\[CLAUDE\]\][^\n]*\n?/,'')).join('\n\n');
}
function openClaude(text){
  const prompt = text.length > 6000 ? text.slice(-6000) : text;
  try{ navigator.clipboard.writeText(text); }catch(e){}
  window.open('https://claude.ai/new?q=' + encodeURIComponent(prompt), '_blank');
}
function handToClaude(){
  const users = history.filter(m => m.role==='user');
  if(!users.length){ window.open('https://claude.ai/new','_blank'); return; }
  const t = history.length > 2 ? 'Bisheriger Verlauf aus meinem Gratis-Chat:\n\n' + transcript() + '\n\nBitte übernimm die letzte Aufgabe.' : users[users.length-1].content;
  openClaude(t);
}

$('send').onclick = () => { const t = $('input').value.trim(); if(!t || busy) return; $('input').value='';
  if(SENSITIVE.test(t)) sensitiveWarning(t, () => send(t)); else send(t); };
$('input').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('send').click(); } });
$('input').addEventListener('input', e => { e.target.style.height='auto'; e.target.style.height = Math.min(e.target.scrollHeight,220)+'px'; });
$('model').onchange = () => store.set('model', $('model').value);
$('clear').onclick = () => { history = []; save(); render(); };
$('toClaude').onclick = handToClaude;
$('settingsBtn').onclick = () => $('settings').showModal();
$('cancelSettings').onclick = () => $('settings').close();
$('saveSettings').onclick = () => {
  const err = $('settingsErr');
  const keys = { geminiKey: cleanKey($('geminiKey').value), groqKey: cleanKey($('groqKey').value), apiKey: cleanKey($('apiKey').value) };
  const names = { geminiKey:'Gemini', groqKey:'Groq', apiKey:'OmniRoute' };
  for(const [f, k] of Object.entries(keys)){
    if(k && !validKey(k)){ err.textContent = 'Der ' + names[f] + '-Key enthält ungültige Zeichen oder ist die gekürzte Version mit Sternchen. Bitte den vollständigen Key einfügen.'; return; }
  }
  const u = $('baseUrl').value.trim();
  if(u && !/^https?:\/\//.test(u)){ err.textContent = 'Die OmniRoute-Adresse muss mit https:// oder http:// beginnen.'; return; }
  if(!keys.geminiKey && !keys.groqKey && !(u && keys.apiKey)){ err.textContent = 'Bitte mindestens einen Gemini- oder Groq-Key eintragen.'; return; }
  err.textContent = '';
  for(const [f, k] of Object.entries(keys)){ store.set(f, k); $(f).value = k; }
  store.set('baseUrl', u); store.set('cool', {});
  $('settings').close();
};
render();
if(!configured()) setTimeout(() => $('settings').showModal(), 300);
</script>
</body>
</html>
